# Softbody live bounce light (GI) settings. The renderer reads this file again within a second of a save.
enabled = 1          # 0: off (the world goes back to its plain ambient light)
avatars = 0         # 1: avatars block and bounce light too (they smear a little as they move)
voxelize_every = 1   # draw a slab of the world every this many frames (2: half the CPU, follows changes half as fast)
stats = 10           # seconds between "[Softbody GI]" lines in the renderer's log (0: none)
glow_rays = 4        # shadow rays each probe aims at glowing things (0 to 8; 0: only its normal rays find them, which flickers)
leak_offset = 0.5    # walls and floors read the light from this far in front of themselves, toward you (m; 0: off)
